<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your file · Vidi</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0f0b24; color: #f1eeff; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid rgba(167,139,250,.22); background: #17142b; }
  header b { font-size: 16px; } header small { color: #b9b3d8; }
  header .sp { flex: 1; }
  a.btn, button { font: inherit; padding: 7px 14px; border-radius: 10px; border: 1px solid rgba(167,139,250,.35); background: #231a52; color: #fff; cursor: pointer; text-decoration: none; }
  main { flex: 1; min-height: 0; }
  iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  pre { margin: 0; padding: 16px; white-space: pre-wrap; word-break: break-word; height: 100%; box-sizing: border-box; overflow: auto; }
  .msg { padding: 32px 16px; color: #b9b3d8; text-align: center; }
</style></head>
<body>
<header><b id="name">Your file</b><small id="when"></small><span class="sp"></span><a class="btn" id="dl" hidden>⬇ Download</a><button id="forget" hidden>Forget this file</button></header>
<main id="view"><p class="msg">Opening…</p></main>
<script src="file.js"></script>
</body></html>
